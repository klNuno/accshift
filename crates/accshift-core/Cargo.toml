[package]
name = "accshift-core"
description = "Core logic for accshift: platforms, config, storage, OS primitives"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
thiserror = { workspace = true }
rusqlite = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
sysinfo = { workspace = true }
open = { workspace = true }
fs4 = { workspace = true }
zeroize = { workspace = true }
pbkdf2 = { workspace = true }
sha2 = { workspace = true }
# `os::select_file` / `select_folder`: the dialog stack accshift-app already
# builds. Default features: the XDG portal, reached through a libdbus loaded at
# run time, so Linux builds need no GTK.
rfd = "0.17"

[target.'cfg(windows)'.dependencies]
winreg = { workspace = true }
windows-sys = { workspace = true }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
keyring = { workspace = true }
