[package]
name = "accshift-core"
description = "Core logic for accshift: platforms, config, storage, OS primitives"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
serde = { workspace = true }
# preserve_order: launcher configs rewritten here (Battle.net.config) keep
# their key order. The GUI already got it through accshift-theme; the CLI and
# this crate's own tests did not.
serde_json = { workspace = true, features = ["preserve_order"] }
reqwest = { workspace = true }
rustls = { workspace = true }
thiserror = { workspace = true }
rusqlite = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
sysinfo = { workspace = true }
open = { workspace = true }
fs4 = { workspace = true }
zeroize = { workspace = true }
pbkdf2 = { workspace = true }
sha2 = { workspace = true }

[target.'cfg(windows)'.dependencies]
winreg = { workspace = true }
windows-sys = { workspace = true }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
keyring = { workspace = true }
