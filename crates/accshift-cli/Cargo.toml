[package]
name = "accshift-cli"
description = "Command-line interface for accshift"
version.workspace = true
edition.workspace = true
authors.workspace = true

[[bin]]
name = "accshift"
path = "src/main.rs"

[dependencies]
accshift-core = { path = "../accshift-core" }
clap = { workspace = true }
# `accshift completions`: MIT OR Apache-2.0, same project as clap.
clap_complete = "4.6.11"
is-terminal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
unicode-width = { workspace = true }

[dev-dependencies]
# Parity tests only: the CLI reads the GUI stores through its own small
# readers, and these tests hold them to the app's sanitizers. Never linked
# into the shipped binary.
accshift-app = { path = "../accshift-app" }

[build-dependencies]
serde_json = "1"
tauri-winres = "0.3"
