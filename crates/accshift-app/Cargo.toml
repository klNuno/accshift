[package]
name = "accshift-app"
description = "UI-free logic of the accshift egui port: the backend trait, its mock and the job runner"
version = "0.0.0"
edition = "2021"
publish = false

# Standalone during the port, like crates/accshift-egui: the root workspace
# excludes this folder, so its CI build stays what it is today. The crate
# joins the root workspace when the egui shell replaces the Tauri one.
[workspace]

[dependencies]
accshift-core = { path = "../accshift-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The crate Tauri's path resolver calls (tauri 2.11 depends on dirs 6), so
# `EguiAppContext` lands on the very same folders as the Tauri app.
dirs = "6"
# The shared HTTP client the Tauri app keeps in its state. Same spec as the
# root workspace so features unify with accshift-core's.
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "json",
  "blocking",
] }
# `descriptor_select_file`.
rfd = "0.17"
# The async half of the Steam, CS2 bridge and Roblox commands (Tauri runs them
# on its tokio runtime). Same minor as the root workspace pin.
tokio = { version = "1.47", features = ["rt-multi-thread"] }
# `legacy_web_storage`: the WebKit origin folder name (SHA-256). Same major
# as accshift-core, so nothing new is built.
sha2 = "0.11"
# `time`: the local time zone with its DST rules, as WebView2 formats dates.
# Default features: `tz-system` reads the Windows zone id and maps it to
# IANA, `tzdb-bundle-platform` embeds the tzdb on Windows (no network, no
# installed database) and reads /usr/share/zoneinfo elsewhere. Same version
# as the root workspace lock.
jiff = "0.2.35"

[target.'cfg(windows)'.dependencies]
# `get_desktop_wallpaper`: the Progman capture of
# src-tauri/src/commands/backdrop.rs, on windows-sys rather than the windows
# crate (accshift-core already builds windows-sys 0.61).
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Storage_Xps",
  "Win32_UI_WindowsAndMessaging",
] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
base64 = "0.23"
# `legacy_web_storage`: reads the WebView2 localStorage LevelDB of v0.x
# installs. Pure Rust, Snappy blocks and the `.log` replay included. No `fs`
# feature: the files are copied into its in-memory env, never opened on disk.
rusty-leveldb = { version = "4", default-features = false }

[target.'cfg(not(windows))'.dependencies]
# `legacy_web_storage`: the WebKit localStorage sqlite of WebKitGTK and
# WKWebView. Same spec as the root workspace.
rusqlite = { version = "0.40", features = ["bundled"] }

[dev-dependencies]
# The WebKit fixtures are built and read on every OS, Windows included
# (tests/legacy_web_storage.rs compiles src/legacy_web_storage/webkit_sqlite.rs
# by path), without growing the Windows app.
rusqlite = { version = "0.40", features = ["bundled"] }
