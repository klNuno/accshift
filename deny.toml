# cargo-deny configuration for the accshift workspace.
#
# Run with `cargo deny check`. It reads the lockfile only, so it never
# compiles anything and is cheap enough to run on every branch.

[graph]
# Check every target the workspace can be built for, not just the host. The
# release workflow builds Windows, Linux and macOS, and each one pulls a
# different half of the dependency tree (zbus on Linux, objc2 on macOS,
# windows-sys on Windows). Leaving `targets` empty keeps all of them in scope.
targets = []
all-features = false

[licenses]
# Explicit allow-list, no wildcard: a new dependency arriving under a copyleft
# or a non-OSI licence has to be looked at by a human before it lands.
#
# Every entry below is a licence cargo-deny actually reported for the current
# lockfile. Crates offering a choice (`MIT OR Apache-2.0` and friends) are
# satisfied by one of these, so licences that only ever appear as the third
# arm of such a choice are deliberately absent.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.8

# The five workspace members carry no `license` field of their own. They are
# never published to a registry and the repository ships a single MIT LICENSE
# at its root, which is what they are covered by.
[[licenses.clarify]]
crate = "accshift-core"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "accshift-cli"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "accshift-theme"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "accshift-app"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "accshift-egui"
expression = "MIT"
license-files = []

[bans]
multiple-versions = "allow"
# The only wildcard requirements in this graph are the path dependencies
# between workspace members, which carry no version by design.
# `allow-wildcard-paths` does not cover them, since it only applies to crates
# marked `publish = false`.
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[advisories]
version = 2
# Unmaintained advisories stay switched on for the whole graph, so a new one
# shows up instead of passing silently. Vulnerability, unsound and yanked
# checks are untouched.
unmaintained = "all"
yanked = "deny"
ignore = []
