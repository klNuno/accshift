[workspace]
resolver = "2"
members = [
  "crates/accshift-core",
  "crates/accshift-cli",
  "crates/accshift-theme",
  "crates/accshift-app",
  "crates/accshift-egui",
]
# Patched copies of upstream crates, built as dependencies only.
exclude = ["crates/accshift-egui/vendor"]

[workspace.package]
version = "1.0.5"
edition = "2021"
authors = ["meetsu"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = [
  "rustls-no-provider",
  "json",
  "blocking",
] }
# The crypto provider of reqwest's rustls, installed by accshift-core's http
# module: ring, as reqwest 0.12's `rustls-tls` had.
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "std",
  "tls12",
] }
thiserror = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
winreg = "0.56"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Security_Cryptography",
  "Win32_System_Console",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
tokio = { version = "1.53", features = ["rt", "rt-multi-thread", "macros"] }
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
# ShellExecuteExW instead of a powershell.exe child per link or folder open.
open = { version = "5", features = ["shellexecute-on-windows"] }
fs4 = { version = "1.1", features = ["sync"] }
clap = { version = "4", features = ["derive"] }
directories = "6"
is-terminal = "0.4"
unicode-width = "0.2"
keyring = "4"
pbkdf2 = "0.13"
sha2 = "0.11"
zeroize = "1"

# epaint with one patch: a font can supply its glyph coverage
# (FontData::face_rasterizer), so ui::text rasterizes with DirectWrite like
# WebView2. See the header of crates/accshift-egui/vendor/epaint/Cargo.toml
# and its src/text/face_rasterizer.rs.
[patch.crates-io]
epaint = { path = "crates/accshift-egui/vendor/epaint" }

# Built for size: a smaller exe reaches `main` sooner (crates/accshift-egui
# build.rs), except the per-frame hot path below.
[profile.release]
panic = "abort"
codegen-units = 1
lto = "fat"
opt-level = "s"
strip = true

[profile.release.package.egui_software_backend]
opt-level = 3

[profile.release.package.epaint]
opt-level = 3

# Avatar SVG raster and blur, off the UI thread but on the way to `ready`.
[profile.release.package.accshift-egui]
opt-level = 3

[profile.release.package.resvg]
opt-level = 3

[profile.release.package.tiny-skia]
opt-level = 3

[profile.release.package.tiny-skia-path]
opt-level = 3

# The `windows` bindings crate alone needs about 2 GB of RAM at opt-level 2
# with one codegen unit. Fat LTO optimizes its bitcode again at the final link,
# so building it unoptimized changes the compile peak, not the binary.
[profile.release.package.windows]
opt-level = 0
codegen-units = 16
