name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux Tauri build deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libssl-dev \
            pkg-config

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@49c3e4e92c52e7f8392712a9267bbe71c5ab30e5 # v1.19.0
        with:
          node-version: 22
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable branch, pinned 2026-06-09
        with:
          components: rustfmt, clippy

      - name: Vite+ check
        run: vp check

      - name: Svelte check
        run: vp run check:frontend

      - name: Frontend tests
        run: vp test

      # setup-vp only puts `vp` on PATH; the server worker is a plain pnpm
      # package. `corepack enable` writes its pnpm shim next to the real node
      # binary, which is not on PATH here, so drive pnpm through corepack
      # itself (version pinned by packageManager in the root package.json).
      - name: Install server dependencies
        run: corepack pnpm --dir server install --frozen-lockfile

      - name: Server typecheck
        run: corepack pnpm --dir server exec tsc --noEmit

      - name: Build frontend
        run: vp build

      # clippy, check:rust and test:rust each run scripts/stage-cli.mjs first:
      # tauri-build resolves `externalBin` at build-script time and the sidecar
      # is gitignored, so a fresh checkout has to stage it before any of them.

      - name: Cargo fmt
        run: vp run fmt:check

      - name: Cargo clippy
        run: vp run clippy

      - name: Cargo check
        run: vp run check:rust

      - name: Rust tests
        run: vp run test:rust

      - name: Cargo audit
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo install cargo-audit --quiet
          cargo audit --file Cargo.lock
