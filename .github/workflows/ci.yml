name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux Tauri build deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libssl-dev \
            pkg-config

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: 22
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable branch, pinned 2026-06-09
        with:
          components: rustfmt, clippy

      - name: Vite+ check
        run: vp check

      - name: Svelte check
        run: vp run check:frontend

      - name: Frontend tests
        run: vp test

      # setup-vp only puts `vp` on PATH; the server worker is a plain pnpm
      # package. `corepack enable` writes its pnpm shim next to the real node
      # binary, which is not on PATH here, so drive pnpm through corepack
      # itself (version pinned by packageManager in the root package.json).
      - name: Install server dependencies
        run: corepack pnpm --dir server install --frozen-lockfile

      - name: Server typecheck
        run: corepack pnpm --dir server exec tsc --noEmit

      - name: Build frontend
        run: vp build

      # clippy, check:rust and test:rust each run scripts/stage-cli.mjs first:
      # tauri-build resolves `externalBin` at build-script time and the sidecar
      # is gitignored, so a fresh checkout has to stage it before any of them.

      - name: Cargo fmt
        run: vp run fmt:check

      - name: Cargo clippy
        run: vp run clippy

      - name: Cargo check
        run: vp run check:rust

      - name: Rust tests
        run: vp run test:rust

      - name: Cargo audit
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo install cargo-audit --quiet
          cargo audit --file Cargo.lock

  # The egui app and its UI-free crates are standalone workspaces (their
  # `Cargo.toml` says why), so `cargo clippy --workspace` above never sees them.
  egui:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux build deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libdbus-1-dev \
            libgtk-3-dev \
            libxkbcommon-dev \
            pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable branch, pinned 2026-06-09
        with:
          components: rustfmt, clippy

      - name: Cargo fmt
        shell: bash
        run: |
          for crate in accshift-theme accshift-app accshift-egui; do
            cargo fmt --manifest-path "crates/$crate/Cargo.toml" --check
          done

      - name: Cargo clippy
        shell: bash
        run: |
          for crate in accshift-theme accshift-app accshift-egui; do
            cargo clippy --manifest-path "crates/$crate/Cargo.toml" --locked --all-targets -- -D warnings
          done

      - name: Rust tests
        shell: bash
        run: |
          for crate in accshift-theme accshift-app accshift-egui; do
            cargo test --manifest-path "crates/$crate/Cargo.toml" --locked
          done
