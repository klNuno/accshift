name: Dev Build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to build (defaults to current)"
        required: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: accshift-windows
            artifact_paths: |
              target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          # Same container as release.yml: glibc 2.35 whatever the runner image.
          - os: ubuntu-latest
            container: ubuntu:22.04
            artifact_name: accshift-linux
            artifact_paths: |
              target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
              target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
              target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm
          - os: macos-latest
            artifact_name: accshift-macos
            artifact_paths: |
              target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
              target/aarch64-apple-darwin/release/bundle/macos/*.app.zip
    runs-on: ${{ matrix.os }}
    # Empty on Windows and macOS: no container there.
    container: ${{ matrix.container }}
    env:
      DEBIAN_FRONTEND: noninteractive
      # linuxdeploy is an AppImage and the container has no FUSE.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      # Checkout needs git in the container, else it falls back to a tarball.
      - name: Install git
        if: runner.os == 'Linux'
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      # build-essential: the linker; curl, unzip, xz-utils: rustup and Node.
      # libxkbcommon-x11-0: bundle.mjs copies it into the AppImage.
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl file unzip xz-utils \
            libgtk-3-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            librsvg2-dev \
            pkg-config

      - name: Setup Node
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: 22
          run-install: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable branch, pinned 2026-06-09

      - name: Install the bundler
        run: corepack pnpm install --frozen-lockfile

      # No ACCSHIFT_TELEMETRY_URL: a dev build compiles in the inert fallback, so
      # test installs never reach the analytics dashboard. Only release.yml sets it.
      - name: Build the installers (unsigned, no updater artifacts)
        run: node crates/accshift-egui/bundle/bundle.mjs --build --no-updater

      # Same floor as release.yml: a newer runner glibc breaks older distros.
      - name: Check the glibc floor
        if: runner.os == 'Linux'
        run: |
          floor="2.35"
          bin=target/x86_64-unknown-linux-gnu/release/accshift-gui
          need=$(objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -1)
          echo "$bin needs glibc $need (floor $floor)"
          if [ "$(printf '%s\n%s\n' "$floor" "$need" | sort -V | tail -1)" != "$floor" ]; then
            echo "$bin needs glibc $need, above the $floor floor" >&2
            exit 1
          fi

      - name: Compress macOS .app bundle
        if: matrix.os == 'macos-latest'
        run: |
          cd target/aarch64-apple-darwin/release/bundle/macos
          for app in *.app; do
            zip -r "${app%.app}.app.zip" "$app"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error
          retention-days: 14
