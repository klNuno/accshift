name: Dev Build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to build (defaults to current)"
        required: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: accshift-windows
            artifact_paths: |
              target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          - os: ubuntu-latest
            artifact_name: accshift-linux
            artifact_paths: |
              target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
              target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
              target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm
          - os: macos-latest
            artifact_name: accshift-macos
            artifact_paths: |
              target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
              target/aarch64-apple-darwin/release/bundle/macos/*.app.zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install Linux build deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libxkbcommon-dev \
            librsvg2-dev \
            pkg-config

      - name: Setup Node
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: 22
          run-install: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable branch, pinned 2026-06-09

      - name: Install the bundler
        run: corepack pnpm install --frozen-lockfile

      # No ACCSHIFT_TELEMETRY_URL: a dev build compiles in the inert fallback, so
      # test installs never reach the analytics dashboard. Only release.yml sets it.
      - name: Build the installers (unsigned, no updater artifacts)
        run: node crates/accshift-egui/bundle/bundle.mjs --build --no-updater

      - name: Compress macOS .app bundle
        if: matrix.os == 'macos-latest'
        run: |
          cd target/aarch64-apple-darwin/release/bundle/macos
          for app in *.app; do
            zip -r "${app%.app}.app.zip" "$app"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error
          retention-days: 14
