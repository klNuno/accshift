name: Dev Build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to build (defaults to current)"
        required: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: accshift-windows
            artifact_paths: |
              target/release/bundle/nsis/*.exe
              target/release/bundle/msi/*.msi
          - os: ubuntu-latest
            artifact_name: accshift-linux
            artifact_paths: |
              target/release/bundle/deb/*.deb
              target/release/bundle/appimage/*.AppImage
              target/release/bundle/rpm/*.rpm
          - os: macos-latest
            artifact_name: accshift-macos
            artifact_paths: |
              target/release/bundle/dmg/*.dmg
              target/release/bundle/macos/*.app.zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install Linux Tauri build deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libssl-dev \
            pkg-config

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          node-version: 22
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable branch, pinned 2026-06-09

      - name: Validate telemetry endpoint
        shell: pwsh
        env:
          ACCSHIFT_TELEMETRY_URL: ${{ vars.ACCSHIFT_TELEMETRY_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ACCSHIFT_TELEMETRY_URL)) {
            throw "Missing GitHub variable ACCSHIFT_TELEMETRY_URL."
          }
          $uri = $null
          if (-not [Uri]::TryCreate($env:ACCSHIFT_TELEMETRY_URL, [UriKind]::Absolute, [ref]$uri) -or
              $uri.Scheme -ne "https" -or
              [string]::IsNullOrWhiteSpace($uri.Host) -or
              -not [string]::IsNullOrEmpty($uri.UserInfo) -or
              -not [string]::IsNullOrEmpty($uri.Query) -or
              -not [string]::IsNullOrEmpty($uri.Fragment) -or
              $env:ACCSHIFT_TELEMETRY_URL -ne $env:ACCSHIFT_TELEMETRY_URL.Trim() -or
              $env:ACCSHIFT_TELEMETRY_URL.EndsWith('/')) {
            throw "ACCSHIFT_TELEMETRY_URL must be an HTTPS base URL without credentials, query, fragment, or trailing slash."
          }

      - name: Build Tauri bundles (unsigned, no updater artifacts)
        env:
          ACCSHIFT_TELEMETRY_URL: ${{ vars.ACCSHIFT_TELEMETRY_URL }}
        run: vp exec tauri build -c '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Compress macOS .app bundle
        if: matrix.os == 'macos-latest'
        run: |
          cd target/release/bundle/macos
          for app in *.app; do
            zip -r "${app%.app}.app.zip" "$app"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error
          retention-days: 14
