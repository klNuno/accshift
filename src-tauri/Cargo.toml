[package]
name = "accshift-gui"
description = "Accshift desktop account switcher (Tauri GUI)"
version.workspace = true
edition.workspace = true
authors.workspace = true

# The app. On Windows a release build ships it as accshift_gui_lib.dll, loaded
# by a small accshift-gui.exe (src/launcher.rs); everywhere else the exe links
# it statically.
[lib]
name = "accshift_gui_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true, features = [] }
serde_json = { workspace = true }

[dependencies]
accshift-core = { path = "../crates/accshift-core" }
tauri = { workspace = true, features = ["macos-private-api"] }
tauri-plugin-process = { workspace = true }
tauri-plugin-updater = { workspace = true }
tauri-plugin-deep-link = { workspace = true }
tauri-plugin-single-instance = { workspace = true }
# Dev-only agent bridge. Optional so a release build links none of it: the
# plugin exposes execute_js plus an IPC command runner, and an unauthenticated
# WebSocket that reaches every command below (Steam sessions, keyring, paths).
# cfg(debug_assertions) alone would not keep it out of a `tauri dev` handed to
# someone else, so the feature is the real gate.
tauri-plugin-mcp-bridge = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }

[features]
mcp-bridge = ["dep:tauri-plugin-mcp-bridge"]
# Keeps the main window hidden after boot so the startup bench can launch the
# app in a loop without stealing the focus. Measurement only, never shipped.
startup-bench = []

[target.'cfg(windows)'.dependencies]
winreg = { workspace = true }
# Wallpaper capture -> JPEG data URL for the liquid glass fake backdrop.
base64 = { workspace = true }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# Same versions tauri already pulls in; used to flip WebView2 settings tauri
# does not expose (autofill popups on plain text inputs).
webview2-com = "0.38"
# The launcher starts WebView2 through the patched wry (vendor/wry) and finds
# the data directory the way tauri does.
wry = { version = "0.55", default-features = false }
dirs = "6"
windows-core = "0.61"
# Same windows crate tauri pulls in; used for the WM_NCACTIVATE subclass that
# keeps DWM system backdrops alive while the window is unfocused.
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Storage_Xps",
  "Win32_Security",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[dependencies.mimalloc]
workspace = true
